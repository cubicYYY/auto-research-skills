[project]
name = "paper-search"
version = "0.1.0"
description = "Search arXiv, OpenAlex, Semantic Scholar, CrossRef, Google Scholar, PaSa, and GitHub paper-lists; rank with BM25; optionally download PDFs."
requires-python = ">=3.10"
dependencies = [
    "arxiv>=2.1.0",
    "pyalex>=0.15",
    "semanticscholar>=0.8.0",
    "habanero>=1.2.6",
    "scholarly>=1.7.11",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[project.scripts]
paper-search = "paper_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_search"]

[tool.ruff]
line-length = 100
target-version = "py310"
