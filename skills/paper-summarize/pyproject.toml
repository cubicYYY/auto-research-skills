[project]
name = "paper-summarize"
version = "0.1.0"
description = "Summarize academic papers into structured problem/approach/results/limitations/contributions via the Claude API, with prompt caching for follow-up Q&A on the same paper."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pypdf>=4.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
paper-summarize = "paper_summarize.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_summarize"]
