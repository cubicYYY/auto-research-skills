[project]
name = "skill-finder"
version = "0.1.0"
description = "Discover Claude Code skill repos, add them as git submodules under skill-repos/, and expose individual skills into .claude/skills/ via symlinks."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
skill-finder = "skill_finder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_finder"]
